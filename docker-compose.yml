# Local build/preview environment for the blog.
#
# The theme needs Ruby >= 3.0 (macOS ships 2.6), so this pins the same Ruby the
# Pages workflow uses: .github/workflows/jekyll.yml -> ruby-version: '3.1'.
# Nothing is installed on the host; gems live in the named `bundle` volume and
# are reused across runs.
#
#   docker compose up serve          -> http://localhost:4000, live reload
#   docker compose run --rm build    -> production build into ./_site
#   docker compose down              -> stop
#
# Both services layer _config.dev.yml over _config.yml to correct the malformed
# `baseurl` (see the comments in that file); without it every local asset URL
# gets prefixed with /nitesculucian.github.io.
#
# `command` uses list form on purpose: with a folded (>) block, YAML keeps the
# newlines of more-indented lines, which silently splits the flags off into
# separate shell lines and they get ignored.
services:
  # Dev server with live reload.
  serve:
    image: ruby:3.1
    working_dir: /srv
    ports:
      - "4000:4000" # site
      - "35729:35729" # livereload
    volumes:
      - .:/srv
      - bundle:/usr/local/bundle
    environment:
      JEKYLL_ENV: development
    command:
      - bash
      - -c
      - bundle install && bundle exec jekyll serve --config _config.yml,_config.dev.yml --host 0.0.0.0 --port 4000 --livereload --livereload-port 35729 --force_polling

  # One-shot production build, matching what the Pages workflow produces.
  # Writes ./_site and exits.
  build:
    image: ruby:3.1
    working_dir: /srv
    volumes:
      - .:/srv
      - bundle:/usr/local/bundle
    environment:
      JEKYLL_ENV: production
    command:
      - bash
      - -c
      - bundle install && bundle exec jekyll build --config _config.yml,_config.dev.yml

volumes:
  bundle:
